apiVersion: apps/v1
kind: Deployment
metadata:
  name: blue-deployment
  namespace: blue-gree
spec:
  replicas: 2
  selector:
    matchLabels: 
      app: blue-green-deploy
      version: blue
  template:
    metadata:
      labels:
        app: blue-green-deploy
        version: blue
    spec:
       containers:
       -  name: blue-deploy
          image: nginx:latest
          ports:
          - containerPort: 80

