apiVersion: apps/v1
kind: Deployment
metadata:
  name: green-deployment
spec:
  replicas: 2
  selector:
    matchLabels: 
      app: blue-green-deploy
      version: green
  template:
    metadata:
      labels:
        app: blue-green-deploy
        version: green
    spec:
       containers:
       -  name: green-deploy
          image: nginx
          ports:
          - containerPort: 80
